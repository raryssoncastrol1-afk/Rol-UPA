name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite compilar manualmente pela aba Actions do GitHub se desejar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm install

      - name: Build do Web App (Vite/React)
        run: npm run build

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Regenerar Gradle Wrapper (previne corrupção de line-ending)
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3

      - name: Sincronizar Assets com o Capacitor
        run: npx cap sync

      - name: Corrigir PNGs corrompidos (previne erro de compilação da AAPT)
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const base64Png = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
          const pngBuf = Buffer.from(base64Png, 'base64');
          function fix(dir) {
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                fix(fullPath);
              } else if (file.endsWith('.png')) {
                fs.writeFileSync(fullPath, pngBuf);
                console.log('Corrigido:', fullPath);
              }
            }
          }
          fix('android/app/src/main/res');
          "

      - name: Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: Build do APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
