name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite compilar manualmente pela aba Actions do GitHub se desejar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm install

      - name: Build do Web App (Vite/React)
        run: npm run build

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Regenerar Gradle Wrapper (previne corrupção de line-ending)
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3

      - name: Sincronizar Assets com o Capacitor
        run: npx cap sync

      - name: Instalar Pillow para geração de imagens
        run: pip install Pillow

      - name: Gerar Ícones e Splash Screens personalizados (previne corrupção de imagens)
        run: python3 android/generate_assets.py

      - name: Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: Build do APK (Debug e Release)
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew assembleRelease

      - name: Upload do APK Debug (Instalável no Celular)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload do APK Release (Não assinado)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
